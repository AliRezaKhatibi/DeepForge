name: Live monitor gallery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/capture-live-gallery.py'
      - 'scripts/capture-profiler-gallery.py'
      - 'src/deepforge/**'
      - '.github/workflows/live-gallery.yml'
  push:
    branches: [docs/live-monitor-gallery]
    paths:
      - 'scripts/capture-live-gallery.py'
      - '.github/workflows/live-gallery.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth imagemagick
      - run: python -m pip install '.[resources]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import tkinter; print(tkinter.TkVersion)"
      - run: xvfb-run -a -s '-screen 0 1280x900x24' python scripts/capture-live-gallery.py --output gallery
      - run: xvfb-run -a -s '-screen 0 1440x950x24' python scripts/capture-profiler-gallery.py --output gallery
      - name: Capture notebook HTML in browser
        run: |
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1000,900 --screenshot="$PWD/gallery/live-notebook.png" "file://$PWD/gallery/live-notebook.html"
          test -s gallery/live-notebook.png
      - name: Encode public synthetic architecture gallery for repository import
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for p in sorted(Path("gallery").glob("architecture-*")):
              data = base64.b64encode(p.read_bytes()).decode("ascii")
              print(f"DFG_BEGIN {p.name} {len(data)}")
              for i in range(0, len(data), 2048):
                  print("DFG_DATA " + data[i:i+2048])
              print(f"DFG_END {p.name}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deepforge-live-gallery
          path: gallery/
          if-no-files-found: error
