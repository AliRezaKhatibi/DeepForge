name: Colab IPython compatibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  legacy-ipython:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install "ipython==7.34.0" "traitlets==5.7.1" "psutil==5.9.5"
      - run: python -m pip install ".[notebook]" nbformat nbclient ipykernel
      - run: |
          python -c "import IPython; assert IPython.__version__ == '7.34.0'"
          python -m pip check
      - run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          nb = nbformat.read("examples/notebook_compatibility.ipynb", as_version=4)
          NotebookClient(nb, timeout=120, kernel_name="python3").execute()
          PY
