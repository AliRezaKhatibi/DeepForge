name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: python -m pip install '.[dev]'
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - if: runner.os == 'Windows'
        run: python -m pytest -q
      - run: deepforge --version
      - run: python -m pip wheel . --no-deps -w dist
  pytorch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: python -m pip install '.[dev]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: xvfb-run -a python -m pytest -q
  yolo-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[images]'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ultralytics==8.3.200
      - run: python scripts/smoke-yolo.py
