[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepforge-research-toolkit"
version = "0.7.1.1.3"
description = "Local-first deep learning research studio and dataset validation toolkit"
authors = [{name = "Alireza Khatibi"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["deep-learning", "dataset", "reproducibility", "pytorch"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8", "Pillow>=10"]
images = ["Pillow>=10"]
torch = ["torch"]
resources = ["psutil>=5.9"]
notebook = ["ipython>=7.34"]
interactive = ["ipython>=7.34", "ipywidgets>=8"]

[project.scripts]
deepforge = "deepforge.cli:main"
deepforge-studio = "deepforge.gui:main"
deepforge-live = "deepforge.live_view:main"
deepforge-monitor = "deepforge.desktop_monitor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
deepforge = ["assets/*.png", "assets/*.svg", "assets/*.ico", "samples/*.csv", "samples/runs/*.csv", "samples/dataset/*/*/*.png", "samples/yolo/images/*/*.png", "samples/yolo/labels/*/*.txt"]
